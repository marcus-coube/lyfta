# Portão mínimo de qualidade (plano MVP 1.0, P0.7): backend Go e app Flutter.
# Qualquer job vermelho reprova o push/PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão do golang-migrate usada no dev (backend/README.md).
  MIGRATE_VERSION: v4.19.1

jobs:
  # Descobre os serviços existentes em backend/<svc>/go.mod. Evita ter de
  # editar a matrix a cada serviço novo (workout, assessment, comms).
  discover:
    name: Descobrir serviços
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          services=$(find backend -mindepth 2 -maxdepth 2 -name go.mod -print0 \
            | xargs -0 -r -n1 dirname \
            | xargs -r -n1 basename \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "serviços encontrados: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  backend:
    name: backend (${{ matrix.service }})
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      DB_NAME: lyfta_${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      # MinIO só é necessário para os testes de mídia do workout (P1.2), do
      # assessment (P2.3 — foto de evolução) e do comms (P3.2 — imagem de
      # chat). Como `services:` não aceita condicional nem comando
      # customizado, sobe como step — o bucket é criado pelo próprio teste.
      - name: Subir MinIO
        if: matrix.service == 'workout' || matrix.service == 'assessment' || matrix.service == 'comms'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && break
            sleep 2
          done

      # Redis: pub/sub do fan-out de WS no comms (P3.1) e contadores do limite
      # de tentativas no identity (ADR-002 §2c). Mesmo raciocínio do MinIO
      # acima: `services:` não aceita condicional por matrix, então sobe como step.
      - name: Subir Redis
        if: matrix.service == 'comms' || matrix.service == 'identity'
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine
          for i in $(seq 1 30); do
            docker exec redis redis-cli ping && break
            sleep 1
          done

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.service }}/go.mod
          cache-dependency-path: backend/${{ matrix.service }}/go.sum

      # Banco do serviço (ADR-013: um por serviço), com o mesmo nome do dev
      # local — a migration de role do identity referencia lyfta_identity.
      - name: Criar banco
        run: psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${DB_NAME}"

      - name: Instalar golang-migrate
        run: |
          curl -fsSL "https://github.com/golang-migrate/migrate/releases/download/${MIGRATE_VERSION}/migrate.linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin migrate
          migrate -version

      - name: Aplicar migrations
        run: |
          migrate -path "backend/${{ matrix.service }}/migrations" \
            -database "postgres://postgres:postgres@localhost:5432/${DB_NAME}?sslmode=disable" up

      # Biblioteca global de exercícios (P1.3): dado de conteúdo, não de schema,
      # por isso não é migration. Entra como superusuário — as policies de
      # escrita não cobrem tenant_id NULL (ADR-010 §3) — e os testes de busca
      # da biblioteca dependem dela.
      - name: Aplicar seed da biblioteca
        if: matrix.service == 'workout'
        run: |
          psql -v ON_ERROR_STOP=1 -d "${DB_NAME}" \
            -f backend/workout/seed/exercises_seed.sql

      - name: go vet
        working-directory: backend/${{ matrix.service }}
        run: go vet ./...

      # Conecta como lyfta_app (sem BYPASSRLS, criada pelas migrations): é o
      # que faz as policies de RLS valerem nos testes de isolamento (ADR-001).
      - name: go test
        working-directory: backend/${{ matrix.service }}
        env:
          DATABASE_URL: postgres://lyfta_app:lyfta_app_dev@localhost:5432/lyfta_${{ matrix.service }}?sslmode=disable
          # Storage da mídia (workout/assessment). Ignorado pelos serviços que
          # não usam S3.
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          # Pub/sub do comms (P3.1) e limite de tentativas do identity.
          # Ignorado pelos demais serviços.
          REDIS_URL: redis://localhost:6379/0
          # Backfill da migration 0012 do identity (P4.7): roda como
          # superusuário, que ignora RLS. Ignorado pelos demais serviços.
          SUPERUSER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/lyfta_identity?sslmode=disable
        run: go test ./...

  app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Os testes da fila offline (P1.7) abrem SQLite em memória pelo drift,
      # que usa a libsqlite3 **do sistema** no Dart VM (o
      # `sqlite3_flutter_libs` só vale para o app empacotado).
      - name: libsqlite3
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-0

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # Guard do ADR-011 §5: nenhuma string literal de UI fora do design system.
      - name: Strings hardcoded
        run: tool/check_hardcoded_strings.sh

      # Guard do ADR-011 §1 (P4.3): pt-PT/en não podem perder chave (ou
      # placeholder) em relação ao template pt-BR.
      - name: Paridade dos ARBs
        run: dart run tool/check_arb_parity.dart
