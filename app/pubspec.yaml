name: lyfta
description: Lyfta — plataforma de treino para academias, personais e estúdios.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  # Mídia do exercício (P1.6): GIF com cache de disco e vídeo curto.
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  # Upload da mídia do exercício por URL presignada (P1.2): precisa dos bytes
  # e do tamanho do arquivo antes de pedir a URL, em web e mobile.
  file_picker: ^11.0.3
  # Execução de treino offline (P1.7, ADR-003): SQLite local via drift
  # (`drift_flutter` resolve o caminho do banco em mobile/desktop; na web o
  # store é em memória, ver MemoryWorkoutStore), `client_id` UUID v7 da fila
  # de eventos, gatilho de reconexão e o alarme do descanso entre séries
  # (notificação agendada + vibração).
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  connectivity_plus: ^7.3.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  vibration: ^3.2.0
  # Tela Evolução (P2.4): gráfico de progressão de carga, captura de foto
  # (câmera/galeria) e compressão antes do upload presignado — o serviço
  # `assessment` não recebe bytes brutos além do necessário (P2.3).
  fl_chart: ^0.69.2
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # Chat e push (P3.5): WebSocket do `comms` (`GET /ws?token=`, P3.2) é
  # entrega quente — a mesma reconexão-com-backoff do worker offline do
  # P1.7, mas para eventos em tempo real em vez de fila de escrita.
  web_socket_channel: ^3.0.3
  # Push FCM (P3.4/P3.5): `firebase_messaging` exige `firebase_core`
  # inicializado primeiro. Só mobile — web fica com badge in-app no MVP
  # (ADR-012 §2, web push é 3.0), então a inicialização é condicionada a
  # `!kIsWeb` em `main.dart`.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^1.1.2
  # Geração do banco local (`dart run build_runner build` depois de mexer nas
  # tabelas de features/workout/data/local/workout_database.dart).
  drift_dev: ^2.34.5
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  generate: true
