name: lyfta
description: Lyfta — plataforma de treino para academias, personais e estúdios.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  # Mídia do exercício (P1.6): GIF com cache de disco e vídeo curto.
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  # Upload da mídia do exercício por URL presignada (P1.2): precisa dos bytes
  # e do tamanho do arquivo antes de pedir a URL, em web e mobile.
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true
  generate: true
